<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Main Menu - Math Game</title>
    
    <!-- External Responsive CSS -->
    <link rel="stylesheet" href="../css/responsive.css">
    
    <!-- Internal CSS for Dark Cherry Blossom Base Layout -->
    <style>
        /* Base Reset & Global Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0a0a0a 0%, #1a0000 50%, #4d0011 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ffffff;
            overflow-x: hidden;
            position: relative;
            padding: 40px 20px;
        }

        /* Cherry Blossom Glowing Background Orbs */
        body::before, body::after {
            content: '';
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            z-index: 0;
        }

        body::before {
            width: 400px;
            height: 400px;
            background: rgba(255, 0, 68, 0.12);
            top: -100px;
            left: -100px;
        }

        body::after {
            width: 350px;
            height: 350px;
            background: rgba(128, 0, 32, 0.15);
            bottom: -100px;
            right: -100px;
        }

        /* Floating Background Math Symbols */
        .math-symbols {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 0;
            pointer-events: none;
            list-style: none;
        }

        .math-symbols li {
            position: absolute;
            display: block;
            color: rgba(255, 255, 255, 0.25);
            font-weight: bold;
            font-family: 'Courier New', Courier, monospace;
            bottom: -150px;
            animation: floatUp linear infinite;
        }

        @keyframes floatUp {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-120vh) rotate(360deg); opacity: 0; }
        }

        /* Main Menu Glassmorphism Container */
        .menu-container {
            position: relative;
            z-index: 1;
            background: rgba(15, 15, 15, 0.6);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            padding: 3rem 2.5rem;
            border-radius: 24px;
            text-align: center;
            max-width: 900px;
            width: 100%;
            border: 1px solid rgba(255, 77, 109, 0.15);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), 0 0 30px rgba(255, 0, 68, 0.12);
            animation: fadeIn 0.8s ease-out forwards;
        }

        h1 {
            font-size: 2.3rem;
            margin-bottom: 2rem;
            background: linear-gradient(90deg, #ff4d6d, #ff003c);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 4px 12px rgba(255, 0, 60, 0.25);
        }

        /* Base Mode Grid Layout */
        .mode-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 2.5rem;
        }

        /* Base Card Styling */
        .mode-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            background: rgba(25, 15, 20, 0.5);
            border: 1px solid rgba(255, 77, 109, 0.2);
            border-radius: 16px;
            padding: 24px 15px;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            position: relative;
            overflow: hidden;
        }

        .mode-box::before {
            content: '';
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: linear-gradient(135deg, rgba(255, 0, 60, 0.15), transparent);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .mode-box:hover {
            transform: translateY(-6px);
            border-color: rgba(255, 77, 109, 0.6);
            box-shadow: 0 10px 25px rgba(255, 0, 60, 0.3);
        }

        .mode-box:hover::before {
            opacity: 1;
        }

        .mode-number {
            font-size: 1.8rem;
            font-weight: 800;
            color: #ff4d6d;
            background: rgba(255, 0, 68, 0.15);
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 12px;
            border: 1px solid rgba(255, 77, 109, 0.3);
            transition: transform 0.3s ease;
        }

        .mode-box:hover .mode-number {
            transform: scale(1.1) rotate(5deg);
            background: rgba(255, 0, 68, 0.3);
            color: #ffffff;
        }

        .mode-name {
            font-size: 1.1rem;
            font-weight: 600;
            color: #ffffff;
            letter-spacing: 0.5px;
        }

        /* Back Button */
        .back-btn {
            display: inline-block;
            text-decoration: none;
            color: #ffffff;
            font-weight: bold;
            font-size: 1rem;
            padding: 12px 35px;
            border-radius: 50px;
            background: linear-gradient(45deg, #4a0011, #800020);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            border: 1px solid rgba(255, 77, 109, 0.3);
        }

        .back-btn:hover {
            transform: translateY(-2px);
            background: linear-gradient(45deg, #800020, #ff003c);
            box-shadow: 0 8px 20px rgba(255, 0, 60, 0.4);
        }

        @keyframes fadeIn {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <!-- Floating Background Math Symbols Container -->
    <ul class="math-symbols" id="mathSymbols"></ul>

    <!-- Menu Container -->
    <div class="menu-container">
        <h1>Select Game Mode</h1>
        
        <div class="mode-grid">
            <a href="all-mode/1-multiplication.html" class="mode-box mode-1">
                <span class="mode-number">🧮</span>
                <span class="mode-name">Multiplication</span>
            </a>
            <a href="all-mode/2-addition.html" class="mode-box mode-2">
                <span class="mode-number">➕</span>
                <span class="mode-name">Addition</span>
            </a>
            <a href="all-mode/3-subtraction.html" class="mode-box mode-3">
                <span class="mode-number">➖</span>
                <span class="mode-name">Subtraction</span>
            </a>
            <a href="all-mode/4-division.html" class="mode-box mode-4">
                <span class="mode-number">➗</span>
                <span class="mode-name">Division</span>
            </a>
            <a href="all-mode/5-target.html" class="mode-box mode-5">
                <span class="mode-number">🎯</span>
                <span class="mode-name">Target Pair</span>
            </a>
            <a href="all-mode/6-middle-value.html" class="mode-box mode-6">
                <span class="mode-number">❓</span>
                <span class="mode-name">Middle Value</span>
            </a>
            <a href="all-mode/7-memory.html" class="mode-box mode-7">
                <span class="mode-number">🧠</span>
                <span class="mode-name">Memory Grid</span>
            </a>
        </div>


        <a href="Welcome.html" class="back-btn">Back to Guide</a>
    </div>

    <!-- Script for Random Floating Symbols -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const symbolsContainer = document.getElementById('mathSymbols');
            const characters = ['+', '-', '×', '÷', '=', '?', '%', '1', '2', '3', '4', '5', '6', '7', '8', '9'];
            const totalSymbols = 22;

            for (let i = 0; i < totalSymbols; i++) {
                const li = document.createElement('li');
                li.textContent = characters[Math.floor(Math.random() * characters.length)];
                li.style.left = `${Math.random() * 100}%`;
                li.style.fontSize = `${Math.random() * 3 + 1.5}rem`;
                li.style.animationDuration = `${Math.random() * 15 + 12}s`;
                li.style.animationDelay = `${Math.random() * 12}s`;
                symbolsContainer.appendChild(li);
            }
        });
    </script>
    <script src="../js/main.js"></script>
</body>
</html>
