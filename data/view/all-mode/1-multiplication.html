<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mode 1: Perkalian - Math Game</title>
    <link rel="stylesheet" href="../../css/main.css">
    <link rel="stylesheet" href="../../css/mode-css/1-multiplication.css">
</head>
<body>
    <div class="game-container">
        <!-- Header dengan Poin dan Timer -->
        <div class="game-header">
            <div class="score-display">
                <span class="label">Poin:</span>
                <span id="score" class="value">0</span>
            </div>
            <div class="timer-display">
                <span class="label">Waktu:</span>
                <span id="timer" class="value">10</span>
            </div>
        </div>

        <!-- Area Game -->
        <div id="gameArea" class="game-area">
            <div class="question-box">
                <h2 id="question">Memuat soal...</h2>
            </div>

            <div class="answers-grid">
                <button class="answer-btn" data-answer="0"></button>
                <button class="answer-btn" data-answer="1"></button>
                <button class="answer-btn" data-answer="2"></button>
                <button class="answer-btn" data-answer="3"></button>
            </div>
        </div>

        <!-- Game Over Screen -->
        <div id="gameOver" class="game-over hidden">
            <h2>Game Selesai!</h2>
            <div class="final-score">
                <p>Poin Akhir:</p>
                <span id="finalScore">0</span>
            </div>

            <div class="correct-answer-info" style="margin: 15px 0; color: #ff4444; font-weight: bold; font-size: 1.1rem;">
                <p id="correctAnswerMessage"></p>
            </div>
            
            <div class="game-over-buttons">
                <button id="restartBtn" class="btn-primary">Main Lagi</button>
                <a href="../menu-utama.html" class="btn-secondary">Kembali ke Menu</a>
            </div>
        </div>
    </div>

    <script src="../../js/main.js"></script>
    <script src="../../js/logic/1-multiplication.js"></script>
</body>
</html>
