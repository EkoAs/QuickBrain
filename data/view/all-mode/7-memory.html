<!-- Memory game mode placeholder -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mode 7: Memory Grid - Math Game</title>
    <link rel="stylesheet" href="../../css/main.css">
    <!-- Load specific CSS for Mode 7 -->
    <link rel="stylesheet" href="../../css/mode-css/7-memory.css">
</head>
<body>
    <div class="game-container">
        <!-- Header with Level and Status -->
        <div class="game-header">
            <div class="score-display">
                <span class="label">Level:</span>
                <span id="score" class="value">1</span>
            </div>
            <div class="timer-display">
                <span class="label">Status:</span>
                <span id="statusText" class="value">Get Ready!</span>
            </div>
        </div>

        <!-- Game Area -->
        <div id="gameArea" class="game-area">
            <div class="question-box">
                <h2>Remember the pattern!</h2>
            </div>
            
            <!-- Dynamic Memory Grid Container -->
            <div id="memoryGrid" class="memory-grid">
                <!-- JavaScript will generate the tiles here -->
            </div>
        </div>

        <!-- Game Over Screen -->
        <div id="gameOver" class="game-over hidden">
            <h2>Game Over!</h2>
            <div class="final-score">
                <p>Max Level Reached:</p>
                <span id="finalScore">1</span>
            </div>
            <div class="game-over-buttons">
                <button id="restartBtn" class="btn-primary">Play Again</button>
                <a href="../menu-utama.html" class="btn-secondary">Back to Menu</a>
            </div>
        </div>
    </div>

    <script src="../../js/main.js"></script>
    <!-- Load specific JS for Mode 7 -->
    <script src="../../js/logic/7-memory.js"></script>
</body>
</html>
