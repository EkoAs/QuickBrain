<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Page title -->
    <title>Mode 6: Middle Value - Math Game</title>
    <link rel="stylesheet" href="../../css/main.css">
    <!-- Call CSS file for Mode 6 -->
    <link rel="stylesheet" href="../../css/mode-css/6-middle-value.css">
</head>
<body>
    <!-- Wadah untuk partikel angka jatuh -->
    <div id="particle-container"></div>

    <div class="game-container">
        <!-- Header with Score and Timer -->
        <div class="game-header">
            <div class="score-display">
                <span class="label">Score:</span>
                <span id="score" class="value">0</span>
            </div>
            <div class="timer-display">
                <span class="label">Time:</span>
                <span id="timer" class="value">10</span>
            </div>
        </div>

        <!-- Game Area -->
        <div id="gameArea" class="game-area">
            <div class="question-box">
                <h2 id="question">Loading...</h2>
            </div>

            <div class="answers-grid">
                <button class="answer-btn" data-answer="0"></button>
                <button class="answer-btn" data-answer="1"></button>
                <button class="answer-btn" data-answer="2"></button>
                <button class="answer-btn" data-answer="3"></button>
            </div>
        </div>

        <!-- Game Over Screen -->
        <div id="gameOver" class="game-over hidden">
            <h2>Game Over!</h2>
            <div class="final-score">
                <p>Final Score:</p>
                <span id="finalScore">0</span>
            </div>

            <div class="correct-answer-info" style="margin: 15px 0; color: #ff4d6d; font-weight: bold; font-size: 1.1rem;">
                <p id="correctAnswerMessage"></p>
            </div>
            
            <div class="game-over-buttons">
                <button id="restartBtn" class="btn-primary">Play Again</button>
                <a href="../menu-utama.html" class="btn-secondary">Back to Menu</a>
            </div>
        </div>
    </div>

    <!-- Script Partikel Angka (Cherry Blossom Minecraft Style) -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const particleContainer = document.getElementById("particle-container");

            function createNumberParticle() {
                const particle = document.createElement("div");
                particle.classList.add("math-particle");
                
                // Isi partikel dengan angka acak 0-9
                particle.innerText = Math.floor(Math.random() * 10);

                // Posisi horizontal acak (0vw hingga 100vw)
                particle.style.left = `${Math.random() * 100}vw`;

                // Durasi jatuh (fall) acak antara 6s - 10s (agar lambat dan santai)
                const fallDuration = Math.random() * 4 + 6;
                // Durasi goyangan (sway) acak antara 2s - 4s
                const swayDuration = Math.random() * 2 + 2;

                // Terapkan animasi CSS (fall dan sway berjalan bersamaan)
                particle.style.animation = `
                    fall ${fallDuration}s linear forwards, 
                    sway ${swayDuration}s ease-in-out infinite alternate
                `;

                // Ukuran acak dan opasitas acak agar terlihat dinamis
                particle.style.fontSize = `${Math.random() * 1.5 + 1}rem`;
                particle.style.opacity = Math.random() * 0.4 + 0.1; // 0.1 - 0.5 (semi transparan)

                particleContainer.appendChild(particle);

                // Hapus elemen dari DOM setelah animasi jatuhnya selesai
                setTimeout(() => {
                    particle.remove();
                }, fallDuration * 1000);
            }

            // Munculkan partikel baru setiap 250 milidetik
            setInterval(createNumberParticle, 250);
        });
    </script>

    <script src="../../js/main.js"></script>
    <script src="../../js/logic/6-middle-value.js"></script>
</body>
</html>
