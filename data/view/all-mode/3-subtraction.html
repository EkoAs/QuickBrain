<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mode 3: Subtraction - Math Game</title>
    <link rel="stylesheet" href="../../css/main.css">
    <link rel="stylesheet" href="../../css/mode-css/3-subtraction.css">
</head>
<body>
    <!-- Animasi Background Space & Aurora -->
    <div class="aurora-bg"></div>
    <div id="starfield"></div>

    <div class="game-container">
        <!-- Header Score and Timer -->
        <div class="game-header">
            <div class="score-display">
                <span class="label">Score:</span>
                <span id="score" class="value">0</span>
            </div>
            <div class="timer-display">
                <span class="label">Time:</span>
                <span id="timer" class="value">10</span>
            </div>
        </div>

        <!-- Area Game -->
        <div id="gameArea" class="game-area">
            <div class="question-box">
                <h2 id="question">Loading...</h2>
            </div>

            <div class="answers-grid">
                <button class="answer-btn" data-answer="0"></button>
                <button class="answer-btn" data-answer="1"></button>
                <button class="answer-btn" data-answer="2"></button>
                <button class="answer-btn" data-answer="3"></button>
            </div>
        </div>

        <!-- Game Over Screen -->
        <div id="gameOver" class="game-over hidden">
            <h2>Game Over!</h2>
            <div class="final-score">
                <p>Final Score:</p>
                <span id="finalScore">0</span>
            </div>

            <div class="correct-answer-info" style="margin: 15px 0; color: #ff4d6d; font-weight: bold; font-size: 1.1rem;">
                <p id="correctAnswerMessage"></p>
            </div>
            
            <div class="game-over-buttons">
                <button id="restartBtn" class="btn-primary">Play Again</button>
                <a href="../menu-utama.html" class="btn-secondary">Back to Menu</a>
            </div>
        </div>
    </div>

    <!-- JavaScript Khusus Animasi Background -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const starfield = document.getElementById("starfield");
            
            // 1. Membuat Bintang Berkelip (Twinkling Stars)
            const numStars = 80;
            for(let i = 0; i < numStars; i++) {
                let star = document.createElement("div");
                star.classList.add("star");
                star.style.left = `${Math.random() * 100}vw`;
                star.style.top = `${Math.random() * 100}vh`;
                star.style.animationDuration = `${Math.random() * 3 + 2}s`;
                star.style.animationDelay = `${Math.random() * 5}s`;
                starfield.appendChild(star);
            }

            // 2. Fungsi memunculkan Bintang Jatuh (Vertikal/Miring)
            function spawnShootingStar() {
                let shootingStar = document.createElement("div");
                shootingStar.classList.add("shooting-star");
                shootingStar.style.left = `${Math.random() * 100}vw`;
                shootingStar.style.top = `-10px`;
                starfield.appendChild(shootingStar);

                // Hapus elemen setelah animasi selesai (2 detik)
                setTimeout(() => {
                    shootingStar.remove();
                }, 2000);
            }

            // 3. Fungsi memunculkan Komet (Horizontal) - Hanya Layar Besar
            function spawnComet() {
                if (window.innerWidth > 768) {
                    let comet = document.createElement("div");
                    comet.classList.add("comet");
                    comet.style.top = `${Math.random() * 40}vh`; // Muncul di area atas
                    // Muncul dari kiri atau kanan secara acak
                    if (Math.random() > 0.5) {
                        comet.style.left = `-100px`;
                        comet.style.animationName = `cometMoveRight`;
                    } else {
                        comet.style.right = `-100px`;
                        comet.style.transform = "rotate(180deg)";
                        comet.style.animationName = `cometMoveLeft`;
                    }
                    starfield.appendChild(comet);

                    // Hapus elemen setelah animasi selesai (4 detik)
                    setTimeout(() => {
                        comet.remove();
                    }, 4000);
                }
            }

            // Interval kemunculan meteor dan komet
            setInterval(spawnShootingStar, 4000); // Bintang jatuh setiap 4 detik
            setInterval(spawnComet, 12000);       // Komet setiap 12 detik
        });
    </script>

    <script src="../../js/main.js"></script>
    <script src="../../js/logic/3-subtraction.js"></script>
</body>
</html>
