<!-- Target game mode placeholder -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Page title -->
    <title>Mode 5: Target - Math Game</title>
    <link rel="icon" type="image/svg+xml" href="https://ui-avatars.com/api/?name=Math+Game&background=0ea5e9&color=fff&size=128&bold=true">
    <link rel="stylesheet" href="../../css/main.css">
    <link rel="stylesheet" href="../../css/mode-css/5-target.css">
</head>
<body>
    <div class="game-container">
        <!-- Header with Score and Timer -->
        <div class="game-header">
            <div class="score-display">
                <span class="label">Score:</span>
                <span id="score" class="value">0</span>
            </div>
            <div class="timer-display">
                <span class="label">Time:</span>
                <span id="timer" class="value">15</span>
            </div>
        </div>

        <!-- Game Area -->
        <div id="gameArea" class="game-area">
            <div class="question-box">
                <h2 id="question">Loading...</h2>
                <p class="instruction">Select 2 numbers</p>
            </div>

            <!-- 6 Buttons Grid -->
            <div class="answers-grid target-grid">
                <button class="answer-btn target-btn"></button>
                <button class="answer-btn target-btn"></button>
                <button class="answer-btn target-btn"></button>
                <button class="answer-btn target-btn"></button>
                <button class="answer-btn target-btn"></button>
                <button class="answer-btn target-btn"></button>
            </div>
        </div>

        <!-- Game Over Screen -->
        <div id="gameOver" class="game-over hidden">
            <h2>Game Over!</h2>
            <div class="final-score">
                <p>Final Score:</p>
                <span id="finalScore">0</span>
            </div>

            <!-- NEW ELEMENT TO SHOW CORRECT ANSWER -->
            <div class="correct-answer-info" style="margin: 15px 0; color: #ff4444; font-weight: bold; font-size: 1.1rem;">
                <p id="correctAnswerMessage"></p>
            </div>

            <div class="game-over-buttons">
                <button id="restartBtn" class="btn-primary">Play Again</button>
                <a href="../menu-utama.html" class="btn-secondary">Back to Menu</a>
            </div>
        </div>
    </div>

    <script src="../../js/main.js"></script>
    <script src="../../js/logic/5-target.js"></script>
</body>
</html>
